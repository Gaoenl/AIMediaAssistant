server:
  port: 8080

spring:
  application:
    name: aima-java
  datasource:
    hikari:
      keepalive-time: 60000      # 每 60s 对空闲连接探活,防止被 NAT/防火墙静默掐断
      max-lifetime: 600000       # 连接最长存活 10 分钟,低于 NAT 空闲超时
      minimum-idle: 1
      maximum-pool-size: 10
    url: ${AIMA_DB_URL:jdbc:postgresql://localhost:5432/aima}
    username: ${AIMA_DB_USERNAME:gel}
    password: ${AIMA_DB_PASSWORD:990901}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: aima-producer-group

aima:
  jwt:
    # M1 骨架用固定密钥,生产必须用环境变量注入(>=32 字节)
    secret: ${AIMA_JWT_SECRET:aima-m1-dev-secret-change-me-please-32bytes}
    expire-hours: 24